# Releases an approved test version to everyone.
# The founder taps "Release build N to everyone" in the app's test version; that sets
# release_gate.approved_build in the database. Every 10 minutes this checks that switch
# and, if the waiting test build is approved, copies beta/ over the live app.
name: Release approved test version
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency: release
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Is the waiting test build approved?
        id: gate
        env:
          SB_URL: https://acufuumrjbzbiktodojz.supabase.co
          SB_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFjdWZ1dW1yamJ6YmlrdG9kb2p6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQwNzYyMjEsImV4cCI6MjEwOTY1MjIyMX0.yioLflzuQ3rhUkTZWQWhOAjPXokV4lO_zNnLV-UM_7A
        run: |
          approved=$(curl -sf "$SB_URL/rest/v1/release_gate?select=approved_build&id=eq.1" -H "apikey: $SB_KEY" | python3 -c "import sys,json; print(json.load(sys.stdin)[0]['approved_build'])")
          if [ ! -f beta/build.json ]; then echo "no test version waiting"; exit 0; fi
          test=$(python3 -c "import json; print(json.load(open('beta/build.json'))['build'])")
          live=$(python3 -c "import json; print(json.load(open('build.json'))['build'])")
          echo "approved=$approved test=$test live=$live"
          if [ "$approved" -ge "$test" ] && [ "$test" -gt "$live" ]; then echo "go=1" >> "$GITHUB_OUTPUT"; echo "build=$test" >> "$GITHUB_OUTPUT"; fi
      - name: Copy the test version over the live app
        if: steps.gate.outputs.go == '1'
        run: |
          python3 build.py --promote
          git config user.name "Coulee release"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release build ${{ steps.gate.outputs.build }} to everyone (approved in the app)"
          git push
      - name: Publish the site
        if: steps.gate.outputs.go == '1'
        run: |
          # start the website update, then make sure it actually finished; retry if GitHub's build fails
          api="https://api.github.com/repos/${{ github.repository }}/pages/builds"
          auth=(-H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json")
          for attempt in 1 2 3; do
            curl -sf -X POST "${auth[@]}" "$api" >/dev/null || true
            for i in $(seq 1 40); do
              sleep 15
              st=$(curl -sf "${auth[@]}" "$api/latest" | python3 -c "import sys,json; print(json.load(sys.stdin).get('status',''))" || echo "")
              [ "$st" = "built" ] && { echo "site updated"; exit 0; }
              [ "$st" = "errored" ] && break
            done
            echo "site update didn't finish (attempt $attempt); trying again"
          done
          echo "::error::The website didn't update after 3 tries. The release is saved; re-run this job or push any change."
          exit 1
